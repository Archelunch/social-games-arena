# Pre-commit hooks for the Social Deduction Benchmark.
# Install once per clone:  poetry run pre-commit install
# Tools run through Poetry so they use the versions locked in pyproject.toml.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: poetry run ruff check
        language: system
        types: [python]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: poetry run ruff format --check
        language: system
        types: [python]
        require_serial: true
      - id: pyrefly
        name: pyrefly check
        entry: poetry run pyrefly check
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
